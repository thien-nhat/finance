<!DOCTYPE html> <html lang="vi"> <head>   <meta charset="UTF-8">   <title>Quản Lý Tài Chính Cá Nhân</title>   <meta name="viewport" content="width=device-width, initial-scale=1">   <style>     :root {       --main: #3178c6;       --main-light: #e3f0fc;       --danger: #f44336;       --success: #43a047;       --gray: #f8f9fa;       --dark: #1a1a2e;     }     body {       font-family: 'Segoe UI', Arial, sans-serif;       background: var(--gray);       margin: 0;       padding: 0;       color: var(--dark);     }     .container {       max-width: 480px;       margin: 40px auto;       background: #fff;       border-radius: 12px;       box-shadow: 0 4px 24px rgba(49,120,198,0.08);       padding: 32px 20px 24px 20px;     }     h1 {       text-align: center;       color: var(--main);       margin-bottom: 16px;       font-size: 2.1em;     }     .balance {       text-align: center;       margin-bottom: 24px;     }     .balance .amount {       font-size: 2em;       color: var(--main);       margin: 0;     }     .summary {       display: flex;       justify-content: space-around;       margin-bottom: 24px;     }     .summary div {       background: var(--main-light);       border-radius: 8px;       padding: 12px 16px;       text-align: center;       min-width: 90px;     }     .summary .inc {       color: var(--success);     }     .summary .exp {       color: var(--danger);     }     form {       display: flex;       gap: 10px;       margin-bottom: 18px;       flex-wrap: wrap;       align-items: center;     }     form input, form select {       padding: 9px 8px;       border: 1px solid #bbb;       border-radius: 6px;       font-size: 1em;     }     form input[type="number"] {       width: 90px;     }     form input[type="text"] {       flex: 1 1 120px;       min-width: 90px;     }     form select {       min-width: 70px;     }     form button {       padding: 9px 18px;       background: var(--main);       color: #fff;       border: none;       border-radius: 6px;       cursor: pointer;       transition: background 0.2s;     }     form button:hover {       background: #2160a0;     }     .filters {       display: flex;       justify-content: flex-end;       gap: 6px;       margin-bottom: 8px;     }     .filters button {       background: var(--gray);       border: 1px solid #bbb;       color: var(--main);       border-radius: 6px;       padding: 6px 14px;       cursor: pointer;       transition: border 0.2s;     }     .filters button.active {       background: var(--main);       color: #fff;       border: 1px solid var(--main);     }     ul.transactions {       list-style: none;       padding: 0;       margin: 0;       max-height: 270px;       overflow-y: auto;     }     ul.transactions li {       display: flex;       align-items: center;       justify-content: space-between;       padding: 11px 6px;       border-bottom: 1px solid #ececec;       font-size: 1.07em;       background: #fff;       transition: background 0.2s;     }     ul.transactions li.income .amount {       color: var(--success);     }     ul.transactions li.expense .amount {       color: var(--danger);     }     .category {       font-size: 0.95em;       color: #888;       margin-left: 4px;     }     .date {       font-size: 0.92em;       color: #aaa;       margin-left: 10px;       white-space: nowrap;     }     ul.transactions li button {       background: none;       border: none;       color: var(--danger);       font-size: 1.2em;       cursor: pointer;       margin-left: 12px;       transition: color 0.2s;     }     ul.transactions li button:hover {       color: #d32f2f;     }     @media (max-width: 520px) {       .container {         margin: 0;         border-radius: 0;         box-shadow: none;         padding: 18px 3vw 18px 3vw;       }       h1 { font-size: 1.4em; }     }   </style> </head> <body>   <div class="container">     <h1>Quản Lý Tài Chính</h1>     <div class="balance">       <div>Số dư hiện tại</div>       <div class="amount" id="balance">0₫</div>     </div>     <div class="summary">       <div>         <div>Thu</div>         <div class="inc" id="total-income">0₫</div>       </div>       <div>         <div>Chi</div>         <div class="exp" id="total-expense">0₫</div>       </div>     </div>     <form id="addForm" autocomplete="off">       <input type="text" id="desc" placeholder="Ghi chú (VD: Lương, Ăn sáng...)" required>       <input type="number" id="amount" placeholder="Số tiền" required min="1">       <select id="type">         <option value="income">Thu</option>         <option value="expense">Chi</option>       </select>       <button type="submit">Thêm</button>     </form>     <div class="filters">       <button type="button" data-filter="all" class="active">Tất cả</button>       <button type="button" data-filter="income">Thu</button>       <button type="button" data-filter="expense">Chi</button>     </div>     <ul class="transactions" id="transactions"></ul>     <div style="text-align:center;color:#aaa;font-size:0.93em;margin-top:10px;">       <span>© 2025 Quản lý tài chính cá nhân</span>     </div>   </div>   <script>     // State     let transactions = JSON.parse(localStorage.getItem('transactions_v1') || '[]');     let filter = 'all';     function save() {       localStorage.setItem('transactions_v1', JSON.stringify(transactions));     }     function render() {       const txList = document.getElementById('transactions');       txList.innerHTML = '';       let filtered = filter === 'all' ? transactions : transactions.filter(tx => tx.type === filter);       // Sort mới nhất lên đầu       filtered = filtered.slice().sort((a, b) => b.created - a.created);       for (const tx of filtered) {         const li = document.createElement('li');         li.className = tx.type;         li.innerHTML = `           <span>             <b>${tx.desc}</b>             <span class="category">${tx.type === 'income' ? 'Thu' : 'Chi'}</span>             <span class="date">${new Date(tx.created).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric'})}</span>           </span>           <span>             <span class="amount">${tx.type === 'income' ? '+' : '-'}${tx.amount.toLocaleString('vi-VN')}₫</span>             <button title="Xóa" onclick="removeTx('${tx.id}')">&times;</button>           </span>         `;         txList.appendChild(li);       }       calcSummary();     }     function calcSummary() {       let income = 0, expense = 0;       for (const tx of transactions) {         if (tx.type === 'income') income += tx.amount;         else expense += tx.amount;       }       document.getElementById('total-income').innerText = income.toLocaleString('vi-VN') + '.000₫';       document.getElementById('total-expense').innerText = expense.toLocaleString('vi-VN') + '.000₫';       document.getElementById('balance').innerText = (income - expense).toLocaleString('vi-VN') + '.000₫';     }     document.getElementById('addForm').onsubmit = function(e) {       e.preventDefault();       const desc = document.getElementById('desc').value.trim();       const amount = +document.getElementById('amount').value;       const type = document.getElementById('type').value;       if (!desc || amount < 1) return;       transactions.push({         id: (Math.random() + Date.now()).toString(36),         desc,         amount,         type,         created: Date.now()       });       save();       render();       this.reset();       document.getElementById('desc').focus();     };     function removeTx(id) {       transactions = transactions.filter(tx => tx.id !== id);       save();       render();     }     window.removeTx = removeTx;     document.querySelectorAll('.filters button').forEach(btn => {       btn.onclick = function() {         document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));         this.classList.add('active');         filter = this.getAttribute('data-filter');         render();       }     });     render();   </script> </body> </html>
